<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 44" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="sp-top" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#22E5F5"/>
      <stop offset="100%" stop-color="#0096D6"/>
    </linearGradient>
    <linearGradient id="sp-bot" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0070C0"/>
      <stop offset="100%" stop-color="#004EA8"/>
    </linearGradient>
    <linearGradient id="sp-side" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#003B6F"/>
      <stop offset="100%" stop-color="#001E40"/>
    </linearGradient>
  </defs>
  <!-- Left shadow face -->
  <polygon points="4,6 4,38 22,22" fill="url(#sp-side)"/>
  <!-- Top bright face -->
  <polygon points="4,6 22,22 50,22" fill="url(#sp-top)"/>
  <!-- Bottom medium face -->
  <polygon points="4,38 22,22 50,22" fill="url(#sp-bot)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 52" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="sp-a" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#40F0FF"/>
      <stop offset="100%" stop-color="#0088DD"/>
    </linearGradient>
    <linearGradient id="sp-b" x1="0" y1="0" x2="0.5" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0066CC"/>
      <stop offset="100%" stop-color="#003F99"/>
    </linearGradient>
  </defs>
  <!-- dark left back face -->
  <polygon points="4,26 14,4 14,48" fill="#0a1628"/>
  <!-- bright upper face -->
  <polygon points="14,4 56,26 28,26" fill="url(#sp-a)"/>
  <!-- medium lower face -->
  <polygon points="14,48 28,26 56,26" fill="url(#sp-b)"/>
  <!-- inner dark shadow top -->
  <polygon points="4,26 14,4 28,26" fill="#061020" opacity="0.6"/>
  <!-- inner dark shadow bottom -->
  <polygon points="4,26 28,26 14,48" fill="#061020" opacity="0.4"/>
</svg>
